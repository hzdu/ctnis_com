name: Keep Render Alive

on:
  schedule:
    # 使用 Cron 表达式，每 5 分钟执行一次
    - cron: "*/5 * * * *"
  # 允许在 GitHub 网页端手动点击运行（方便测试）
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service
        # 将下面的 URL 替换为你自己的 Render 服务地址
        run: |
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" https://my-woocommerce-api.onrender.com/
